<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210" role="img" aria-label="GitHub statistics">
<rect width="480" height="210" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<style>.t{font:700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6f5fcf}.k{font:500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#57606a}.v{font:700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#1f2328}.hero{font:800 44px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#1f2328}.hl{font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#57606a}.row{animation:fade .5s ease both}@keyframes fade{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.row{animation:none}}</style>
<text class="t" x="24" y="34">Hamed Kazemi's GitHub stats</text>
<g class="row" style="animation-delay:0.0s">
<circle cx="28" cy="62" r="3" fill="#6f5fcf"/>
<text class="k" x="40" y="66">Total stars</text>
<text class="v" x="270" y="66" text-anchor="end">1</text>
</g>
<g class="row" style="animation-delay:0.1s">
<circle cx="28" cy="86" r="3" fill="#6f5fcf"/>
<text class="k" x="40" y="90">Commits in 2026</text>
<text class="v" x="270" y="90" text-anchor="end">1.8k</text>
</g>
<g class="row" style="animation-delay:0.2s">
<circle cx="28" cy="110" r="3" fill="#6f5fcf"/>
<text class="k" x="40" y="114">Pull requests</text>
<text class="v" x="270" y="114" text-anchor="end">247</text>
</g>
<g class="row" style="animation-delay:0.3s">
<circle cx="28" cy="134" r="3" fill="#6f5fcf"/>
<text class="k" x="40" y="138">Issues</text>
<text class="v" x="270" y="138" text-anchor="end">2</text>
</g>
<g class="row" style="animation-delay:0.4s">
<circle cx="28" cy="158" r="3" fill="#6f5fcf"/>
<text class="k" x="40" y="162">Contributed to</text>
<text class="v" x="270" y="162" text-anchor="end">5</text>
</g>
<g class="row" style="animation-delay:0.5s">
<circle cx="28" cy="182" r="3" fill="#6f5fcf"/>
<text class="k" x="40" y="186">Followers</text>
<text class="v" x="270" y="186" text-anchor="end">10</text>
</g>
<circle cx="390" cy="118" r="58" fill="#f6f8fa" stroke="#d0d7de"/>
<circle cx="390" cy="118" r="58" fill="none" stroke="#6f5fcf" stroke-width="3" stroke-dasharray="364" stroke-dashoffset="364" transform="rotate(-90 390 118)"><animate attributeName="stroke-dashoffset" from="364" to="0" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></circle>
<text class="hero" x="390" y="128" text-anchor="middle">14</text>
<text class="hl" x="390" y="150" text-anchor="middle">public repos</text>
</svg>
